<!doctype html>
<html lang="en" data-font="clean">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#859075" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Couch Potato" />
    <!-- SEO tokens filled from src/seo.ts via Vite transformIndexHtml -->
    <title>__SEO_DEFAULT_TITLE__</title>
    <meta name="description" content="__SEO_DESCRIPTION__" />
    <link rel="canonical" href="__SEO_CANONICAL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SEO_PRODUCT_NAME__" />
    <meta property="og:url" content="__SEO_CANONICAL__" />
    <meta property="og:title" content="__SEO_PRODUCT_NAME__" />
    <meta property="og:description" content="__SEO_OG_DESCRIPTION__" />
    <meta property="og:image" content="__SEO_OG_IMAGE__" />
    <meta property="og:image:width" content="__SEO_OG_IMAGE_WIDTH__" />
    <meta property="og:image:height" content="__SEO_OG_IMAGE_HEIGHT__" />
    <meta property="og:image:alt" content="__SEO_PRODUCT_NAME__" />
    <meta property="og:locale" content="en_US" />
    <!-- `property` required for Vercel OG checker; `name` is the classic Twitter form -->
    <meta name="twitter:card" property="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" property="twitter:title" content="__SEO_PRODUCT_NAME__" />
    <meta
      name="twitter:description"
      property="twitter:description"
      content="__SEO_OG_DESCRIPTION__"
    />
    <meta name="twitter:image" property="twitter:image" content="__SEO_OG_IMAGE__" />
    <meta name="twitter:image:alt" property="twitter:image:alt" content="__SEO_PRODUCT_NAME__" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="application/ld+json">
      __SEO_JSON_LD__
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
