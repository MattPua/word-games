<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" fill="none" role="img" aria-label="Couch Potato">
  <!-- floor shadow -->
  <ellipse cx="64" cy="104" rx="42" ry="5" fill="#d8e0d9"/>

  <!-- couch body -->
  <rect x="16" y="56" width="96" height="34" rx="12" fill="#7c9082"/>
  <!-- seat -->
  <rect x="26" y="48" width="76" height="18" rx="9" fill="#a8bdaa"/>
  <!-- back -->
  <rect x="24" y="28" width="80" height="26" rx="12" fill="#8fa393"/>
  <!-- back split -->
  <line x1="64" y1="32" x2="64" y2="52" stroke="#7c9082" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- arms -->
  <rect x="10" y="40" width="18" height="36" rx="9" fill="#5f7366"/>
  <rect x="100" y="40" width="18" height="36" rx="9" fill="#5f7366"/>
  <!-- legs -->
  <rect x="24" y="88" width="10" height="12" rx="3" fill="#5f7366"/>
  <rect x="94" y="88" width="10" height="12" rx="3" fill="#5f7366"/>

  <!-- potato -->
  <ellipse cx="64" cy="42" rx="28" ry="22" fill="#e4b574"/>
  <ellipse cx="72" cy="48" rx="14" ry="11" fill="#d4a05e" opacity="0.28"/>
  <!-- freckles -->
  <circle cx="48" cy="32" r="2" fill="#c9924a"/>
  <circle cx="80" cy="30" r="1.7" fill="#c9924a"/>
  <circle cx="70" cy="26" r="1.4" fill="#c9924a"/>
  <!-- eyes -->
  <ellipse cx="55" cy="40" rx="3.4" ry="4.2" fill="#5c4030"/>
  <ellipse cx="73" cy="40" rx="3.4" ry="4.2" fill="#5c4030"/>
  <circle cx="56.2" cy="38.8" r="1.1" fill="#f8f7f4"/>
  <circle cx="74.2" cy="38.8" r="1.1" fill="#f8f7f4"/>
  <!-- smile -->
  <path d="M57 48c3 3.5 11 3.5 14 0" stroke="#5c4030" stroke-width="2.4" stroke-linecap="round"/>
  <!-- arms hanging -->
  <path d="M38 50c-7 6-10 14-8 20" stroke="#e4b574" stroke-width="8" stroke-linecap="round"/>
  <path d="M90 50c7 6 10 14 8 20" stroke="#e4b574" stroke-width="8" stroke-linecap="round"/>
</svg>
